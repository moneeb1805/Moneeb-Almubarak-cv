<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-hidden="false"><title>Solar tracking system concept</title>

  <rect width="640" height="400" fill="#0a1220"/>
  <rect x="24" y="24" width="592" height="352" rx="16" fill="#0f172a" stroke="#1e293b"/>
  <text x="48" y="58" font-family="IBM Plex Sans,sans-serif" font-size="13" font-weight="600" fill="#60a5fa">Solar Tracking · Engineering Concept</text>
  <!-- sun -->
  <circle cx="480" cy="110" r="28" fill="#fbbf24" opacity=".85"/>
  <g stroke="#fbbf24" stroke-width="2" opacity=".5">
    <line x1="480" y1="70" x2="480" y2="58"/><line x1="480" y1="162" x2="480" y2="150"/>
    <line x1="440" y1="110" x2="428" y2="110"/><line x1="532" y1="110" x2="520" y2="110"/>
  </g>
  <!-- rays to panel -->
  <line x1="455" y1="130" x2="300" y2="230" stroke="#fbbf24" stroke-width="1.5" opacity=".35" stroke-dasharray="6 5"/>
  <line x1="470" y1="135" x2="330" y2="245" stroke="#fbbf24" stroke-width="1.5" opacity=".25" stroke-dasharray="6 5"/>
  <!-- panel -->
  <g transform="translate(220 210) rotate(-18)">
    <rect x="0" y="0" width="180" height="100" rx="8" fill="#1e293b" stroke="#60a5fa"/>
    <path d="M30 0 V100 M60 0 V100 M90 0 V100 M120 0 V100 M150 0 V100 M0 33 H180 M0 66 H180" stroke="#334155"/>
    <rect x="0" y="0" width="180" height="100" rx="8" fill="#3b82f6" opacity=".12"/>
  </g>
  <!-- mount -->
  <line x1="310" y1="280" x2="310" y2="340" stroke="#64748b" stroke-width="4"/>
  <line x1="270" y1="340" x2="350" y2="340" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
  <!-- angle indicator -->
  <path d="M310 280 A40 40 0 0 0 278 255" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <text x="250" y="250" font-family="IBM Plex Sans,sans-serif" font-size="11" fill="#94a3b8">θ track</text>
  <!-- energy graph + control -->
  <rect x="48" y="96" width="150" height="100" rx="12" fill="#111827" stroke="#243044"/>
  <text x="64" y="120" font-family="IBM Plex Sans,sans-serif" font-size="11" fill="#94a3b8">Energy curve</text>
  <polyline points="64,170 84,160 104,150 124,142 144,136 164,130" fill="none" stroke="#34d399" stroke-width="2"/>
  <rect x="48" y="214" width="150" height="70" rx="12" fill="#111827" stroke="#243044"/>
  <text x="64" y="238" font-family="IBM Plex Sans,sans-serif" font-size="11" fill="#94a3b8">Control signal</text>
  <polyline points="64,262 80,255 96,265 112,248 128,258 144,245 160,250" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <rect x="420" y="280" width="172" height="70" rx="12" fill="#111827" stroke="#243044"/>
  <text x="436" y="308" font-family="IBM Plex Sans,sans-serif" font-size="11" fill="#94a3b8">MATLAB · Fuzzy logic</text>
  <text x="436" y="328" font-family="IBM Plex Sans,sans-serif" font-size="11" fill="#64748b">Tracking algorithm concept</text>

</svg>
